[package]
name = "ile"
version = "0.1"
edition = 26

[dependencies]
fmt = "12.1.0"
boost = { version = "1.89.0", features = ["url"], }
cpx = {
    version = "0.1.0",
    features = ["fmt", "cli", "json", "protobuf"],
}
whisper = {
    version = "1.9.1",
    features = [
        "ggml/cpu",
        # "ggml/blas", "ggml/metal" # only for mac
    ],
}
miniaudio = "0.11.25"
dotenv = "1.0"
xxhash = "0.8.3"
